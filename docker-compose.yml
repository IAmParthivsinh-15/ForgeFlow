# ForgeFlow local development stack - Phase 0 and Milestones 1-3.
#
#   docker compose --profile ci up --build -d     # with local Jenkins for the CI stage
#   docker compose up --build -d                  # without Jenkins (CI stage pauses)
#
# UI: http://localhost:8080   API: http://localhost:8000/docs   Health: http://localhost:8000/health
# Jenkins (profile ci): http://localhost:8081  user/password from JENKINS_USER/JENKINS_PASSWORD

x-python-service: &python-service
  build:
    context: .
    dockerfile: docker/python.Dockerfile
  env_file:
    - path: .env
      required: false
  environment:
    MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0&directConnection=true
    REDIS_URL: redis://redis:6379/0
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    REPOS_ROOT: /repos
    WORKSPACES_ROOT: /workspaces
    # Interpolated from the shell or .env, so `FAKE_LLM=true docker compose up` works too.
    FAKE_LLM: ${FAKE_LLM:-false}
    JENKINS_URL: http://jenkins:8080
    JENKINS_PUBLIC_URL: http://localhost:8081
    JENKINS_USER: ${JENKINS_USER:-forgeflow}
    JENKINS_PASSWORD: ${JENKINS_PASSWORD:-forgeflow-local}
    JENKINS_REPOS_ROOT: /repos
  volumes:
    # Read-write: ForgeFlow creates forgeflow/* branches and worktrees (never pushes).
    - ./repos:/repos
    - ./workspaces:/workspaces
  depends_on:
    mongodb: { condition: service_healthy }
    redis: { condition: service_healthy }
    kafka: { condition: service_healthy }
  restart: unless-stopped

services:
  mongodb:
    image: mongo:7
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      # Initiates the single-node replica set (needed for transactions) on first run.
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongodb:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  platform-api:
    <<: *python-service
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 10

  orchestrator-worker:
    <<: *python-service
    command: ["python", "-m", "forgeflow.apps.worker.main"]

  # Executes dispatched tasks. Scale with: docker compose up -d --scale agent-worker=3
  agent-worker:
    <<: *python-service
    command: ["python", "-m", "forgeflow.apps.agent_worker.main"]

  # Local CI (spec section 56). Optional: start with `--profile ci`.
  jenkins:
    profiles: ["ci"]
    build:
      context: docker/jenkins
    ports: ["8081:8080"]
    environment:
      JENKINS_ADMIN_ID: ${JENKINS_USER:-forgeflow}
      JENKINS_ADMIN_PASSWORD: ${JENKINS_PASSWORD:-forgeflow-local}
    volumes:
      - jenkins-home:/var/jenkins_home
      # Pipelines clone the commit under verification from here (read-only).
      - ./repos:/repos:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/login > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports: ["8080:80"]
    depends_on:
      platform-api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  mongo-data:
  kafka-data:
  jenkins-home:
