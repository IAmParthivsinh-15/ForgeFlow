# Prometheus for the Kubernetes deployment: a copy of ops/prometheus/prometheus.yml (the
# service names are the same in docker compose and Kubernetes). Spec section 67.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API latency and deployment checks.
  - job_name: platform-api
    metrics_path: /metrics
    static_configs:
      - targets: ["platform-api:8000"]

  # Workflow/task/agent/test/CI metrics (from relayed events), Kafka lag, Redis latency,
  # worktree count. DNS discovery also finds scaled replicas.
  - job_name: orchestrator-worker
    dns_sd_configs:
      - names: ["orchestrator-worker"]
        type: A
        port: 9101

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
