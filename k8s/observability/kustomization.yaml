# Prometheus + Grafana for the forgeflow namespace (spec sections 67, 102, 111).
#   kubectl apply -k k8s/observability
# Dashboards are generated by ops/grafana/generate_dashboards.py.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgeflow
resources:
  - observability.yaml
configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml
      - alerts.yml
  - name: grafana-provisioning
    files:
      - datasources.yml=grafana-datasources.yml
      - dashboards.yml=grafana-dashboards.yml
  - name: grafana-dashboards
    files:
      - dashboards/platform.json
      - dashboards/agents.json
      - dashboards/task-graph.json
      - dashboards/ci-cd.json
      - dashboards/infrastructure.json
      - dashboards/failures.json
      - dashboards/autonomy.json
