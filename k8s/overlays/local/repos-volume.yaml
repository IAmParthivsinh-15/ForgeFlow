# Host folder with your repositories, mounted into the minikube node:
#   minikube mount ./repos:/mnt/forgeflow/repos --uid 10001 --gid 10001
apiVersion: v1
kind: PersistentVolume
metadata:
  name: forgeflow-repos-host
spec:
  capacity:
    storage: 5Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: forgeflow
    name: forgeflow-repos
  hostPath:
    path: /mnt/forgeflow/repos
    type: DirectoryOrCreate
