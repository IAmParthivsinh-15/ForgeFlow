apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        forgeflow.dev/role: app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: forgeflow
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: forgeflow/python
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: forgeflow-config
            - secretRef:
                name: forgeflow-secrets
          readinessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: repos
              mountPath: /repos
            - name: workspaces
              mountPath: /workspaces
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: forgeflow-repos
        - name: workspaces
          persistentVolumeClaim:
            claimName: forgeflow-workspaces
        - name: artifacts
          persistentVolumeClaim:
            claimName: forgeflow-artifacts
---
apiVersion: v1
kind: Service
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
spec:
  selector:
    app.kubernetes.io/name: platform-api
  ports:
    - name: http
      port: 8000
      targetPort: http
