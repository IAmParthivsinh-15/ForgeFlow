# Executes tasks; scales horizontally (HPA in hpa.yaml, spec section 112). MongoDB task
# claims (not Kafka) decide which replica runs a task, so scaling is safe.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent-worker
  labels:
    app.kubernetes.io/name: agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-worker
        forgeflow.dev/role: app
    spec:
      serviceAccountName: forgeflow
      automountServiceAccountToken: false
      # Long agent runs: give a task time to finish on scale-down; the reaper retries
      # anything interrupted (spec section 49).
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          image: forgeflow/python
          command: ["python", "-m", "forgeflow.apps.agent_worker.main"]
          ports:
            # The commit under test is served here for the browser (Playwright MCP).
            - name: preview-0
              containerPort: 4173
            - name: preview-1
              containerPort: 4174
            - name: preview-2
              containerPort: 4175
          envFrom:
            - configMapRef:
                name: forgeflow-config
            - secretRef:
                name: forgeflow-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: repos
              mountPath: /repos
            - name: workspaces
              mountPath: /workspaces
            - name: artifacts
              mountPath: /artifacts
      volumes:
        - name: repos
          persistentVolumeClaim:
            claimName: forgeflow-repos
        - name: workspaces
          persistentVolumeClaim:
            claimName: forgeflow-workspaces
        - name: artifacts
          persistentVolumeClaim:
            claimName: forgeflow-artifacts
