[project]
name = "forgeflow"
version = "0.1.0"
description = "ForgeFlow - autonomous software engineering control plane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "openai-agents>=0.3",
    "openai>=1.60",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "pymongo>=4.10",
    "redis>=5.0",
    "aiokafka>=0.11",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/forgeflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
# ASYNC240: quick pathlib metadata checks in async code are acceptable here.
ignore = ["S101", "ASYNC240"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.mypy]
python_version = "3.12"
packages = ["forgeflow"]
mypy_path = "src"
strict = false
ignore_missing_imports = true
