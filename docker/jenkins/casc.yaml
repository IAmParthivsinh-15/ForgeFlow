# Jenkins configuration as code for the local ForgeFlow CI instance.
# Credentials come from the container environment (see docker-compose.yml).
jenkins:
  systemMessage: "ForgeFlow local CI - jobs are generated by ForgeFlow from validated templates."
  numExecutors: 2
  mode: NORMAL
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_ID}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "http://localhost:8081/"
